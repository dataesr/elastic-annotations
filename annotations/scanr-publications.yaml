  topics.domain.id:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Unique identifier for the scientific domain associated with a topic.
      notes: Used to link topics to broader domain taxonomies or classification systems.
  topics.field:
    status: draft
    type: object
    ai_suggestion:
