  topics.field.id:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Unique identifier for the scientific field associated with a topic.
  topics.id:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Unique identifier for a topic extracted from the publication.
  topics.score:
    status: draft
    type: float
    ai_suggestion:
