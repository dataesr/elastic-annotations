  cited_by_counts_by_year.2024:
    status: draft
    type: long
    ai_suggestion:
      description: Number of citations received by the publication in 2024.
      notes: Data may be partial for recent years; use cautiously for analysis.
  cited_by_counts_by_year.2025:
    status: draft
    type: long
    ai_suggestion:
      description: Number of citations received by the publication in 2025.
      notes: Data is likely incomplete or projected; avoid relying on this for analysis.
  cited_by_counts_by_year.2026:
    status: draft
    type: long
    ai_suggestion:
      description: Number of citations received by the publication in the year 2026.
      notes: Used for citation trend analysis; may be zero or absent if data is unavailable.
  co_authors:
    status: approved
    type: text-array
    description: List of all combinations of two authors as text
    has_keyword: true
  co_countries:
    status: approved
    type: text-array
    description: List of all combinations of two affiliated countries as text
    has_keyword: true
  co_domains:
    status: approved
    type: text-array
    description: List of all combinations of two mentioned domain as text
    has_keyword: true
  co_institutions:
    status: approved
