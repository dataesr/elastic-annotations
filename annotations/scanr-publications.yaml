    analyzer: light
    primary: true
    ai_suggestion:
      description: Default language summary of the publication’s key points and findings.
  summary.en:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: English-language summary of the publication’s key points and findings.
  summary.fr:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: French-language summary of the publication’s key points and findings.
  tags:
    status: draft
    type: object
    ai_suggestion:
      description: Categorized metadata tags associated with the publication.
  tags.id:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Unique identifier for the tag, used for cross-referencing or filtering.
  tags.label:
    status: draft
    type: object
    ai_suggestion:
      description: Human-readable label for the tag, localized by language.
  tags.label.default:
    status: draft
    type: text
    has_keyword: true
