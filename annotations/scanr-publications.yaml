  structures.mainAddress.city:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: City where the research structure is primarily located.
  structures.mainAddress.country:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
