_meta:
  index: scanr-persons
  description: Researchers and authors with their affiliations and identifiers (ORCID,
    IdRef). One document is one person.
  total_fields: 185
  approved: 44
  draft: 141
  pending_review: 140
fields:
  acronym:
    status: draft
    type: object
    ai_suggestion:
      description: Contains acronyms of the person's primary affiliations in multiple
        languages
      notes: Use the language-specific fields (e.g., 'en', 'fr') to retrieve the acronym
        in the desired language.
  acronym.default:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: Default acronym of the person's primary affiliation when language
        is unspecified
  acronym.en:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: English acronym of the person's primary affiliation
  acronym.fr:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: French acronym of the person's primary affiliation
  address:
    status: draft
    type: object
    ai_suggestion:
      description: Physical address details of the person's primary affiliation
  address.address:
    status: draft
    type: text
    analyzer: light
    ai_suggestion:
      description: Full street address of the person's primary affiliation
  address.city:
    status: draft
    type: text
    analyzer: light
    ai_suggestion:
      description: City of the person's primary affiliation address
  address.country:
    status: draft
    type: text
    analyzer: light
    ai_suggestion:
      description: Country of the person's primary affiliation address
  affiliations:
    status: approved
    type: array
    description: Lists all detected affiliations
  affiliations.endDate:
    status: approved
    type: string
    description: Last publication year found with this affiliation
  affiliations.publicationsCount:
    status: draft
    type: long
    ai_suggestion:
      description: Total number of publications associated with this affiliation
  affiliations.sources:
    status: approved
    type: array
    description: List the publications of the author with the current affiliation
  affiliations.sources.id:
    status: approved
    type: string
    description: Main PID of the publication
    has_keyword: true
  affiliations.sources.year:
    status: approved
    type: integer
    description: Publication year
    has_keyword: true
  affiliations.startDate:
    status: approved
    type: string
    description: First publication year found with this affiliation
  affiliations.structure:
    status: approved
    type: string
    description: 'PID of an affiliation. Can be the only field of the object if this
      affiliation is not mapped in the organization index.Otherwise, if present, some
      fields are denormalized: `mainAddress`, `label`, `acronym`, `kind`, `level`,
      `status`, `isFrench`, `id_name`. See the documentation of the organization index
      for more details on these fields.'
    required: true
  affiliations.structure.acronym:
    status: draft
    type: object
    ai_suggestion:
      description: Acronyms of the affiliated structure in multiple languages
      notes: Check for language-specific fields (e.g., 'en', 'fr') to disambiguate
        identical acronyms.
  affiliations.structure.acronym.default:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Default acronym of the affiliated organization, if available
      notes: Fallback when no language-specific acronym is present or preferred language
        is unknown.
  affiliations.structure.acronym.fr:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: French acronym of the affiliated organization
      notes: Use when the agent's context or user preference is French.
  affiliations.structure.categories:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Research domain labels assigned to the affiliated organization
      notes: Categories may be hierarchical (e.g., 'Biology > Genetics') and are language-agnostic.
  affiliations.structure.encoded_key:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Unique internal identifier for the organizational structure
      notes: Used for deduplication and linking across datasets; not a public PID.
  affiliations.structure.id:
    status: draft
    type: text
    has_keyword: true
    primary: true
    ai_suggestion:
      description: Unique identifier for the affiliated organization in the scanr-organizations
        index
      notes: Resolve this ID to fetch full organization details from the scanr-organizations
        index.
    cross_index:
      index: scanr-organizations
      join_field: id
  affiliations.structure.id_name:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Human-readable name associated with the organization's identifier
      notes: May differ from the label in 'institutions' due to historical or administrative
        changes.
  affiliations.structure.id_name_default:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Preferred display name of the affiliated organization
      notes: Fallback to this value if localized names are unavailable.
  affiliations.structure.institutions:
    status: draft
    type: object
    ai_suggestion:
      description: Nested object containing historical or hierarchical institution
        data for the affiliation
      notes: Use to explore parent/child relationships or temporal changes in the
        organization.
  affiliations.structure.institutions.endDate:
    status: draft
    type: date
    ai_suggestion:
      description: Last year the institution was referenced in publications
      notes: Null if the institution is still active or no end date detected.
  affiliations.structure.institutions.label:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Display name of the institution within the structure
      notes: May include department or sub-unit names for granularity.
  affiliations.structure.institutions.natural_id:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Persistent internal identifier for the institution, independent
        of name changes
      notes: Useful for tracking institutions across time or mergers.
  affiliations.structure.institutions.relationType:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Type of relationship between the institution and the structure
        (e.g., 'parent', 'child')
      notes: Helps determine hierarchy or collaboration roles in the organization.
  affiliations.structure.institutions.rnsr_key:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: French RNSR identifier for the research institution
      notes: Only present for institutions registered in the French RNSR system.
  affiliations.structure.institutions.startDate:
    status: draft
    type: date
    ai_suggestion:
      description: First year the institution was referenced in publications
      notes: May differ from legal creation date if publications predate indexing.
  affiliations.structure.institutions.structure:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Hierarchical path of parent institutions for this affiliation
      notes: Use to reconstruct the full organizational tree; may be empty if no parent
        exists.
  affiliations.structure.isFrench:
    status: draft
    type: boolean
    ai_suggestion:
      description: Indicates if the affiliation is with a French institution
  affiliations.structure.is_main_parent:
    status: draft
    type: long
    ai_suggestion:
      description: Flag indicating if this structure is the primary parent organization
      notes: 1 for true, 0 for false; used to resolve ambiguous hierarchies.
  affiliations.structure.kind:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Type of institution (e.g., university, research lab, company)
  affiliations.structure.label:
    status: draft
    type: object
    ai_suggestion:
      description: Multilingual labels for the affiliation structure
  affiliations.structure.label.default:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Default name of the institution if no language preference is set
  affiliations.structure.label.fr:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: French name of the institution
  affiliations.structure.mainAddress:
    status: draft
    type: object
    ai_suggestion:
      description: Primary physical address details for the affiliation
  affiliations.structure.mainAddress.address:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Full formatted address of the institution
  affiliations.structure.mainAddress.address_detected:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Raw address string extracted from publication metadata
      notes: Unnormalized; may contain typos or incomplete data.
  affiliations.structure.mainAddress.city:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: City where the institution is primarily located
  affiliations.structure.mainAddress.country:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Country of the affiliation's main address in ISO 3166-1 alpha-2
        format
      notes: Use for filtering or grouping by geographic region.
  affiliations.structure.mainAddress.gps:
    status: draft
    type: object
    ai_suggestion:
      description: Geographic coordinates (latitude and longitude) of the affiliation's
        main address
  affiliations.structure.mainAddress.gps.lat:
    status: draft
    type: float
    ai_suggestion:
      description: Latitude coordinate of the affiliation's main address for mapping
        purposes
  affiliations.structure.mainAddress.gps.lon:
    status: draft
    type: float
    ai_suggestion:
      description: Longitude coordinate of the affiliation's main address for mapping
        purposes
  affiliations.structure.mainAddress.postcode:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Postal code of the affiliation's main address for precise location
        filtering
  affiliations.structure.mainAddress.region:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Administrative region of the organization's main address
      notes: Normalized to ISO 3166-2 codes where possible (e.g., 'FR-IDF').
  affiliations.structure.parents:
    status: draft
    type: object
    ai_suggestion:
      description: Hierarchical parent organizations of the current affiliation with
        temporal context
  affiliations.structure.parents.endDate:
    status: draft
    type: date
    ai_suggestion:
      description: Last year the parent organization was referenced in publications
      notes: Null if the parent is still active or no end date detected.
  affiliations.structure.parents.natural_id:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Persistent identifier of the parent organization for cross-referencing
      notes: Use to link to other records or external databases.
  affiliations.structure.parents.relationType:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Type of relationship between the affiliation and its parent (e.g.,
        department, faculty)
      notes: Helps distinguish structural hierarchy levels.
  affiliations.structure.parents.startDate:
    status: draft
    type: date
    ai_suggestion:
      description: Earliest date when the parent organization relationship began
      notes: Use to determine historical context of organizational hierarchy.
  affiliations.structure.parents.structure:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Name of the parent organization in the affiliation hierarchy
      notes: May be empty if the structure has no known parent or is a top-level entity.
  affiliations.structure.status:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Current operational status of the affiliated structure (e.g., active,
        closed)
      notes: Use to filter or contextualize historical vs. current affiliations.
  affiliations.structure.typologie_1:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Primary classification of the affiliated organization
      notes: Typically broad categories like 'University' or 'Research Institute'.
  affiliations.structure.typologie_2:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Secondary classification of the affiliated organization
      notes: More specific than typologie_1, e.g., 'Public University' or 'Private
        Lab'.
  ai_description:
    status: draft
    type: object
    ai_suggestion:
      description: Container for AI-generated descriptive metadata about the person
      notes: Intended for LLM agents to quickly grasp key attributes without parsing
        raw data.
  ai_description.description:
    status: draft
    type: object
    ai_suggestion:
      description: Multilingual descriptions of the person's research focus or expertise
  ai_description.description.default:
    status: draft
    type: text
    analyzer: light
    ai_suggestion:
      description: Default language description of the person's research focus or
        expertise
  ai_description.description.en:
    status: draft
    type: text
    analyzer: light
    ai_suggestion:
      description: English description of the person's research focus or expertise
  ai_description.description.fr:
    status: draft
    type: text
    analyzer: light
    ai_suggestion:
      description: French description of the person's research focus or expertise
  alias:
    status: draft
    type: text
    has_keyword: true
    analyzer: heavy
    ai_suggestion:
      description: Alternate names or spellings associated with the person
      notes: Useful for disambiguation or fuzzy matching across datasets.
  applicants:
    status: draft
    type: object
    ai_suggestion:
      description: Container for entities that applied for or hold patents linked
        to the person
  applicants.name:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: Name of the applicant entity for patents linked to the person
      notes: May include organizations or individuals; not always the author.
  autocompleted:
    status: approved
    type: array
    description: array of strings used for autocompletion
    analyzer: autocomplete
    exclude: true
  autocompletedText:
    status: draft
    type: text
    analyzer: light
    exclude: true
  awards:
    status: approved
    type: array
    description: Lists the known awards
  awards.date:
    status: approved
    type: string
    description: Award date
  awards.label:
    status: approved
    type: string
    description: Award label
    has_keyword: true
    primary: true
  awards.url:
    status: approved
    type: string
    description: Award URL
    has_keyword: true
  coContributors:
    status: approved
    type: array
    description: Lists the known cocontributors. Co-authors only are listed, not jury
      members.
  coContributors.fullName:
    status: approved
    type: string
    description: Full Name of the cocontributor
    has_keyword: true
  coContributors.person:
    status: approved
    type: string
    description: Main PID of the cocontributor
    has_keyword: true
  description:
    status: draft
    type: object
    ai_suggestion:
      description: Structured biographical or professional summary of the person
      notes: Use for generating concise researcher profiles or contextual responses.
  description.default:
    status: draft
    type: text
    analyzer: light
    ai_suggestion:
      description: Default language version of the person's biographical summary
  description.en:
    status: draft
    type: text
    analyzer: light
    ai_suggestion:
      description: English version of the person's biographical summary
  description.fr:
    status: draft
    type: text
    analyzer: light
    ai_suggestion:
      description: French version of the person's biographical summary
  domains:
    status: approved
    type: array
    description: Lists detected scientific domains - detected and aggregated from
      the publications
    primary: true
  domains.code:
    status: approved
    type: string
    description: Code ID of this domain, if any (depends on `type`)
    has_keyword: true
  domains.count:
    status: approved
    type: integer
    description: Number of times this code has been detected
  domains.label:
    status: approved
    type: string
    description: Label of the scientific domain
    required: true
  domains.label.default:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: Default language label for the person's primary research domain
  domains.type:
    status: approved
    type: string
    description: 'Type of label. Possible values: `wikidata`, `keyword`, `sudoc`.
      Wikidata domains are automatically detected within the title, abstract and keywords.
      Keywords domain are exactly the free-text keywords that have been harvested
      (not normalized).'
    has_keyword: true
    required: true
  externalIds:
    status: approved
    type: array
    description: Lists the known external identifiers
  externalIds.id:
    status: approved
    type: string
    description: Corresponding PID
    has_keyword: true
    primary: true
    required: true
  externalIds.type:
    status: approved
    type: string
    description: other known PID
    has_keyword: true
    primary: true
    enum:
    - idref
    - orcid
    - id_hal
    required: true
  externalIds.url:
    status: approved
    type: string
    description: Corresponding URL
    has_keyword: true
  firstName:
    status: approved
    type: string
    description: First Name
    has_keyword: true
    analyzer: light
  fullName:
    status: approved
    type: string
    description: Full Name (concatenation of the first name and last name)
    has_keyword: true
    analyzer: light
    primary: true
    required: true
  gender:
    status: draft
    type: text
    has_keyword: true
    primary: true
    ai_suggestion:
      description: Inferred or declared gender of the person
      notes: May be null if not determinable from available data.
  id:
    status: approved
    type: string
    description: Main PID of the person. For now, the idref id is used. Concatenation
      of the string `idref` and the idref id itself.
    has_keyword: true
    primary: true
    required: true
  id_hal:
    status: approved
    type: string
    description: idHAL (string)
    has_keyword: true
  idref:
    status: approved
    type: string
    description: idref
    has_keyword: true
    primary: true
  institutions:
    status: draft
    type: object
    ai_suggestion:
      description: Structured data about organizations the person is associated with
      notes: Contains nested fields like label, identifiers, and roles.
  institutions.label:
    status: draft
    type: text
    has_keyword: true
    analyzer: heavy
    ai_suggestion:
      description: Name of the institution as it appears in source records
  inventors:
    status: draft
    type: object
    ai_suggestion:
      description: Structured data about patent-related inventor roles
      notes: Only present if the person has inventor records in patent databases.
  inventors.name:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: Full name of the person as recorded in inventor documents
  isFrench:
    status: draft
    type: boolean
    ai_suggestion:
      description: Indicates if the person has at least one French affiliation
      notes: Useful for filtering researchers with French institutional ties.
  keywords:
    status: draft
    type: object
    ai_suggestion:
      description: Research topics or expertise areas associated with the person,
        by language
      notes: Use the most specific language key available; fall back to 'default'
        if no language match exists.
  keywords.default:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: Default language keywords when no language-specific version is
        provided
  keywords.en:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: English-language keywords describing the person's research focus
  keywords.fr:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: French-language keywords describing the person's research focus
  label:
    status: draft
    type: object
    ai_suggestion:
      description: Preferred display name variants for the person, by language
      notes: Choose the language key that best matches the user's context or fall
        back to 'default'.
  label.default:
    status: draft
    type: text
    has_keyword: true
    analyzer: heavy
    ai_suggestion:
      description: Default display name when no language-specific variant is available
  label.en:
    status: draft
    type: text
    has_keyword: true
    analyzer: heavy
    ai_suggestion:
      description: English-language preferred display name for the person
  label.fr:
    status: draft
    type: text
    has_keyword: true
    analyzer: heavy
    ai_suggestion:
      description: French-language preferred display name for the person
  lastName:
    status: approved
    type: string
    description: Last Name (family name)
    has_keyword: true
    analyzer: light
  leaders:
    status: draft
    type: object
    ai_suggestion:
      description: Structured names of research group leaders or supervisors associated
        with the person
  leaders.firstName:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: First name component of the research leader's full name
  leaders.lastName:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: Author's last name as recorded in leadership or authority records
      notes: May differ from publication metadata if name variants exist.
  orcid:
    status: approved
    type: string
    description: ORCID
    has_keyword: true
  participant_encoded_key:
    status: draft
    type: keyword
    ai_suggestion:
      description: Unique encoded identifier for a participant in a project or publication
  participants:
    status: draft
    type: object
    ai_suggestion:
      description: Nested object containing all project or team participants associated
        with the author
  participants.funding:
    status: draft
    type: float
    ai_suggestion:
      description: Total funding amount associated with the participant in a project
      notes: May be zero if no funding data is available.
  participants.label:
    status: draft
    type: object
    ai_suggestion:
      description: Localized display names for the participant role or position
  participants.label.default:
    status: draft
    type: text
    has_keyword: true
    analyzer: light
    ai_suggestion:
      description: Default display name for the participant role in English
      notes: Fallback when no language-specific label is available.
  publications:
    status: approved
    type: array
    description: Lists the known publications of the author
  publications.publication:
    status: approved
    type: string
    description: Main PID of the publication
    has_keyword: true
    primary: true
    cross_index:
      index: scanr-publications
      join_field: id
  publications.role:
    status: approved
    type: string
    description: Role of the person
    has_keyword: true
    primary: true
  publications.source:
    status: approved
    type: object
    description: Describes the source (generally journal) of the production
  publications.source.isInDoaj:
    status: draft
    type: boolean
    ai_suggestion:
      description: Indicates if the publication's source journal is listed in the
        DOAJ
  publications.source.isOa:
    status: approved
    type: boolean
    description: Is it an open access journal? (source Unpaywall)
  publications.source.journalIssns:
    status: approved
    type: array
    description: Arrays of ISSNs (print, electronic ...)
    has_keyword: true
  publications.source.publisher:
    status: approved
    type: string
    description: Normalized version of the publisher.
    has_keyword: true
  publications.source.title:
    status: approved
    type: string
    description: Title of the source
    has_keyword: true
  publications.title:
    status: approved
    type: object
    description: Title of the publication
  publications.title.default:
    status: approved
    type: string
    description: Default title
    has_keyword: true
  publications.title.en:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: English title of the publication
      notes: May be machine-translated if original is non-English.
  publications.title.fr:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: French title of the publication
      notes: May be machine-translated if original is non-French.
  publications.year:
    status: approved
    type: integer
    description: Year part of the publication Date
    primary: true
  publicationsCount:
    status: approved
    type: integer
    description: Number of publications
    primary: true
  recentAffiliations:
    status: approved
    type: array
    description: Lists all detected affiliations, recents only (still active in the
      last 3 years)
  recentAffiliations.endDate:
    status: draft
    type: date
    ai_suggestion:
      description: Most recent date the author was affiliated with the institution
      notes: 'Format: YYYY-MM-DD; null if ongoing.'
  recentAffiliations.publicationsCount:
    status: draft
    type: long
    ai_suggestion:
      description: Total number of publications linked to this recent affiliation
  recentAffiliations.sources:
    status: draft
    type: object
    ai_suggestion:
      description: Metadata about publications supporting this recent affiliation
      notes: Keys are publication IDs; values contain year, title, etc.
  recentAffiliations.sources.id:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Main PID of the publication linked to the recent affiliation
      notes: Used to trace back to the original publication record.
  recentAffiliations.sources.year:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
      description: Publication year for the source linked to the recent affiliation
      notes: May differ from the affiliation start date if the affiliation spans multiple
        years.
  recentAffiliations.startDate:
    status: draft
    type: date
    ai_suggestion:
      description: Earliest publication year found with this recent affiliation
  recentAffiliations.structure:
    status: draft
    type: object
    ai_suggestion:
      description: Organizational details of the recent affiliation
  recentAffiliations.structure.acronym:
    status: draft
    type: object
    ai_suggestion:
      description: Acronym variations of the affiliated structure
  recentAffiliations.structure.acronym.default:
    status: draft
    type: text
    has_keyword: true
    ai_suggestion:
